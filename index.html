<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
    rel="stylesheet">
    <link 
    rel="stylesheet" 
    href="style.css" 
    media="screen" 
    charset="utf-8">
  </head>
  <body class="page">
    <section class="descr">
      <img class="descr__img" src="./eisenhower-matrix.jpg">
      <a 
      class="more_inf" 
      href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
      </a>
    </section>
    <main class="main">
      <form action="#">
        <div>
        <label class="add-label" for="new-task">Add Item</label>
        <div class="task-row">
          <input id="new-task"class="text-input task" type="text">
          <button class="btn">Add</button>
        </div>
      </div>
      <div>
        <p class="title">Todo</p>
      <ul id="incompleteTasks">
        <li class="list-item">
          <input type="checkbox" class="checkbox">
          <label class="task task--hidden completed-task">Pay Bills</label>
          <input type="text" class="text-input list-text-input task">
          <button class="btn edit">Edit</button>
          <button class="btn delete">
            <img class="delete__arrow" src="./remove.svg">
          </button>
        </li>
        <li class="editMode list-item">
          <input type="checkbox" class="checkbox">
          <label class="task task--hidden completed-task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="text-input list-text-input task">
          <button class="btn edit">Save</button>
          <button class="btn delete">
            <img class="delete__arrow" src="./remove.svg">
          </button>
        </li>
      </ul>
      </div>
      <div>
        <p class="title">Completed</p>
      <ul id="completed-tasks">
        <li class="list-item">
          <input type="checkbox" class="checkbox" checked>
          <label class="task task--hidden completed-task">See the Doctor</label>
          <input type="text" class="text-input list-text-input task">
          <button class="btn edit">Edit</button>
          <button class="btn delete">
            <img class="delete__arrow" src="./remove.svg">
          </button>
        </li>
      </ul>
      </div>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
